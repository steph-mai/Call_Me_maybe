[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to function calling in LLMs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.0.0",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
cache-dir = "./.uv_cache"
